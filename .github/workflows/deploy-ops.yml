# Deploys the console and router to grasp-os-ops: the account that holds a token
# for every client, so it never changes on a merge. Run it by hand from main
# once the change works in grasp-os-staging. Require a reviewer on the grasp-os-ops
# environment in GitHub so a second person approves every run.
name: Deploy grasp-os-ops

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-grasp-os-ops
  cancel-in-progress: false

jobs:
  deploy-ops:
    name: deploy-ops
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-ops/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-ops/cloudflare/api-token
      - run: vp run --filter @grasp-os/console --filter @grasp-os/router deploy
