# Deploys the console and router to grasp-os-ops: the account that holds a token
# for every client, so it never changes on a merge. Run it by hand from main
# once the change works in grasp-os-staging. Require a reviewer on the grasp-os-ops
# environment in GitHub so a second person approves every run.
#
# Every run also copies the shared secrets (Grasp's OAuth app secrets and
# Composio key) from 1Password into the ops account's Secrets Store, where
# the console reads them to set on each client's Workers. The console never
# holds a 1Password credential. Run it with "secrets only" after rotating one
# in 1Password to copy it without deploying; a secrets-only rollout from the
# console then takes it to every client.
name: Deploy grasp-os-ops

on:
  workflow_dispatch:
    inputs:
      secrets-only:
        description: Only copy the shared secrets to Secrets Store; deploy nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-grasp-os-ops
  cancel-in-progress: false

jobs:
  deploy-ops:
    name: deploy-ops
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: grasp-os-ops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@3754dd7dbdb32bd8f6d28b6043de13ad3a75f21f # v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: |
            - args: ["--frozen-lockfile"]
      - uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: true
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: op://grasp-os-ops/cloudflare/account-id
          CLOUDFLARE_API_TOKEN: op://grasp-os-ops/cloudflare/api-token
          SECRETS_STORE_ID: op://grasp-os-ops/cloudflare/secrets-store-id
      # The shared secrets, as this step's outputs only (masked in logs):
      # never exported to the job's env, so no other step, deploys included,
      # sees them. Each is a field of the `shared` item, named as the Worker
      # secret it becomes.
      - id: shared
        uses: 1password/load-secrets-action@70062d7a876d3eb6334754fa26efd2fbd90c32f2 # v5.0.1
        with:
          export-env: false
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          ENTRA_CLIENT_SECRET: op://grasp-os-ops/shared/ENTRA_CLIENT_SECRET
          MICROSOFT_CLIENT_SECRET: op://grasp-os-ops/shared/MICROSOFT_CLIENT_SECRET
          GOOGLE_CLIENT_SECRET: op://grasp-os-ops/shared/GOOGLE_CLIENT_SECRET
          COMPOSIO_API_KEY: op://grasp-os-ops/shared/COMPOSIO_API_KEY
      # Secrets Store keeps each secret by an ID of its own: an existing one
      # is updated by that ID, a missing one created. Values go to wrangler
      # on stdin, never as an argument or in a log line, and are written
      # every run: Secrets Store never reads a value back to compare.
      # The API token reaches curl through its config on stdin, not argv.
      # The store holds only fixed secrets (these, the deployer token, the
      # router key and the client key), never one per client, so one page
      # normally covers it; the list is still read page by page up to
      # `total_pages`.
      - name: Copy the shared secrets to Secrets Store
        env:
          ENTRA_CLIENT_SECRET: ${{ steps.shared.outputs.ENTRA_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ steps.shared.outputs.MICROSOFT_CLIENT_SECRET }}
          GOOGLE_CLIENT_SECRET: ${{ steps.shared.outputs.GOOGLE_CLIENT_SECRET }}
          COMPOSIO_API_KEY: ${{ steps.shared.outputs.COMPOSIO_API_KEY }}
        run: |
          set -euo pipefail
          names=(ENTRA_CLIENT_SECRET MICROSOFT_CLIENT_SECRET GOOGLE_CLIENT_SECRET COMPOSIO_API_KEY)
          # Every value is checked before any is written, so an empty field
          # never leaves the store half updated. Only names are reported.
          empty=()
          for name in "${names[@]}"; do
            if [ -z "${!name}" ]; then
              empty+=("shared/$name")
            fi
          done
          if [ "${#empty[@]}" -gt 0 ]; then
            echo "::error::Empty 1Password fields, nothing written: ${empty[*]}"
            exit 1
          fi
          existing='[]'
          page=1
          while :; do
            response=$(printf 'header = "Authorization: Bearer %s"\n' "$CLOUDFLARE_API_TOKEN" |
              curl --silent --show-error --fail-with-body --config - \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/secrets_store/stores/$SECRETS_STORE_ID/secrets?per_page=100&page=$page")
            existing=$(jq -c --argjson page "$(jq -c '[.result[] | {name, id}]' <<< "$response")" '. + $page' <<< "$existing")
            total=$(jq -r '.result_info.total_pages // 1' <<< "$response")
            if [ "$page" -ge "$total" ]; then
              break
            fi
            page=$((page + 1))
          done
          for name in "${names[@]}"; do
            id=$(jq -r --arg name "$name" '.[] | select(.name == $name) | .id' <<< "$existing")
            if [ -z "$id" ]; then
              printf '%s' "${!name}" | vp exec wrangler secrets-store secret create "$SECRETS_STORE_ID" --name "$name" --scopes workers --remote
            else
              printf '%s' "${!name}" | vp exec wrangler secrets-store secret update "$SECRETS_STORE_ID" --secret-id "$id" --remote
            fi
          done
      # A D1 database's jurisdiction is set only when it is created, and deploy
      # would auto-provision a missing one outside the EU: create the
      # console's database before its first deploy, as CI does for
      # grasp-os-staging. One that exists outside the EU stops the deploy; it
      # has to be recreated.
      - name: Create the console database in the EU
        if: ${{ !inputs.secrets-only }}
        run: |
          existing=$(vp exec wrangler d1 list --json)
          jurisdiction=$(jq -r '.[] | select(.name == "grasp-os-console") | .jurisdiction // "none"' <<< "$existing")
          if [ -z "$jurisdiction" ]; then
            vp exec wrangler d1 create grasp-os-console --jurisdiction eu
          elif [ "$jurisdiction" != "eu" ]; then
            echo "::error::D1 database grasp-os-console is not in the EU jurisdiction ($jurisdiction)"
            exit 1
          fi
      # D1 migrations are additive, so the running console keeps working on
      # the new schema until the deploy after them replaces it.
      - if: ${{ !inputs.secrets-only }}
        run: vp run --filter @grasp-os/console db:migrate
      # Router first: the console binds its hostname map, which the router's
      # first deploy creates, and both need the account's Secrets Store
      # (scripts/wrangler-deploy.ts fills in both ids). So a router deploy
      # that fails stops the console's too. Besides Workers Scripts, D1 and
      # Secrets Store, the job's token needs Workers KV Storage (read, to
      # find the map) and Workflows (edit: the console's deploy registers
      # its provisioning Workflow).
      - if: ${{ !inputs.secrets-only }}
        run: vp run --filter @grasp-os/router deploy
      # The console verifies every request's Access JWT against its Access
      # application (apps/console/src/access.ts) and refuses everyone
      # without these, so a deploy without them would lock staff out: stop
      # before deploying. They're the `grasp-os-ops` environment's variables,
      # not secrets: the AUD tag and the team URL identify the app, they
      # grant nothing. So is CLIENT_DOMAIN, the domain clients are served
      # under: without it the console provisions and deploys no client, but
      # works otherwise, so it's passed only when set (keep_vars keeps the
      # last one). So are ENTRA_CLIENT_ID and GOOGLE_CLIENT_ID, Grasp's
      # OAuth apps' client ids, which each client's core signs people in
      # with: a client whose sign-in names an IdP without one isn't deployed.
      - name: Deploy the console with its Access settings
        if: ${{ !inputs.secrets-only }}
        env:
          CF_ACCESS_AUD: ${{ vars.CF_ACCESS_AUD }}
          CF_ACCESS_ISS: ${{ vars.CF_ACCESS_ISS }}
          CLIENT_DOMAIN: ${{ vars.CLIENT_DOMAIN }}
          ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: |
          set -euo pipefail
          if [ -z "$CF_ACCESS_AUD" ] || [ -z "$CF_ACCESS_ISS" ]; then
            echo "::error::Set CF_ACCESS_AUD and CF_ACCESS_ISS as variables of the grasp-os-ops environment; nothing deployed"
            exit 1
          fi
          vars=(--var "CF_ACCESS_AUD:$CF_ACCESS_AUD" --var "CF_ACCESS_ISS:$CF_ACCESS_ISS")
          for name in CLIENT_DOMAIN ENTRA_CLIENT_ID GOOGLE_CLIENT_ID; do
            if [ -n "${!name}" ]; then
              vars+=(--var "$name:${!name}")
            fi
          done
          vp run --filter @grasp-os/console build
          cd apps/console
          vp exec node ../../scripts/wrangler-deploy.ts "${vars[@]}"
